<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Practical 8 TDD Tests</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
    }

    .pass {
      color: green;
      background: white;
      padding: 8px;
      margin: 6px;
    }

    .fail {
      color: red;
      background: white;
      padding: 8px;
      margin: 6px;
    }
  </style>
</head>
<body>

<h1>Practical 8</h1>
<p>Tests for Iteration 3.</p>

<div id="result"></div>

<script>
  var result = document.getElementById("result");
  var passed = 0;
  var failed = 0;

  function check(name, answer) {
    if (answer) {
      passed++;
      result.innerHTML += "<div class='pass'>PASS: " + name + "</div>";
    } else {
      failed++;
      result.innerHTML += "<div class='fail'>FAIL: " + name + "</div>";
    }
  }

  function makeTasks() {
    return [
      { title: "Task 1", done: true },
      { title: "Task 2", done: false },
      { title: "Task 3", done: false }
    ];
  }

  function removeDone(list) {
    var newList = [];

    for (var i = 0; i < list.length; i++) {
      if (list[i].done === false) {
        newList.push(list[i]);
      }
    }

    return newList;
  }

  function task() {
    return {
      title: "Task 1",
      update: ""
    };
  }

  function addUpdate(t, text) {
    if (text === "") {
      return false;
    }

    t.update = text;
    return true;
  }

  function showUpdate(t) {
    return t.update;
  }

  var mockUsers = [
    { name: "student", pass: "111", role: "Student" },
    { name: "manager", pass: "222", role: "Manager" }
  ];

  function login(name, pass) {
    for (var i = 0; i < mockUsers.length; i++) {
      if (mockUsers[i].name === name && mockUsers[i].pass === pass) {
        return true;
      }
    }

    return false;
  }

  // US7 Tasks

  var a = makeTasks();
  var aResult = removeDone(a);
  check("US7-1 remove completed task", aResult.length === 2);

  var b = makeTasks();
  var bResult = removeDone(b);
  check("US7-2 keep unfinished tasks", bResult[0].done === false && bResult[1].done === false);

  var c = [
    { title: "Task 1", done: false },
    { title: "Task 2", done: false }
  ];
  var cResult = removeDone(c);
  check("US7-3 no completed task to remove", cResult.length === 2);

  // US8 Task 

  var d = task();
  check("US8-1 save valid update", addUpdate(d, "Started task") === true);

  var e = task();
  check("US8-2 reject empty update", addUpdate(e, "") === false);

  var f = task();
  addUpdate(f, "Finished update field");
  check("US8-3 show latest update", showUpdate(f) === "Finished update field");

  // US9 Mock

  check("US9-1 login with correct student account", login("student", "111") === true);

  check("US9-2 reject wrong password", login("student", "wrong") === false);

  check("US9-3 reject unknown user", login("none", "111") === false);

  result.innerHTML += "<h2>Summary</h2>";
  result.innerHTML += "<p>Passed: " + passed + "</p>";
  result.innerHTML += "<p>Failed: " + failed + "</p>";
</script>

</body>
</html>
