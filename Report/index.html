<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PMS - App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header>
  <h1>Project Management System</h1>
  <p>Simple task system for team project.</p>
</header>
<nav>
  <a href="index.html">App</a>
  <a href="requirements.html">Requirements</a>
  <a href="design.html">Design</a>
  <a href="testing.html">Testing</a>
  <a href="tools.html">Tools</a>
</nav>

<section>
  <h2>App</h2>

  <div class="box">
    <h3>Login</h3>
    <input id="loginName" placeholder="username">
    <input id="loginPass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
    <p id="loginMsg"></p>
    <p>Test account: student / 111, manager / 222</p>
  </div>

  <div class="box">
    <h3>Add Task</h3>
    <input id="newTitle" placeholder="task title">
    <select id="newMember">
      <option>Student</option>
      <option>Manager</option>
      <option>Worker</option>
    </select>
    <input id="newDeadline" type="date">
    <button onclick="addTask()">Add Task</button>
  </div>

  <div class="box">
    <h3>Task List</h3>
    <select id="filterMember">
      <option>All</option>
      <option>Student</option>
      <option>Manager</option>
      <option>Worker</option>
    </select>
    <button onclick="showTasks()">View Tasks</button>
    <button onclick="showProgress()">Progress</button>
    <button onclick="showDelayed()">Delayed</button>
    <button onclick="removeCompleted()">Remove Completed</button>
    <p id="appMsg"></p>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Task</th>
          <th>Member</th>
          <th>Status</th>
          <th>Deadline</th>
          <th>Update</th>
          <th>Save</th>
        </tr>
      </thead>
      <tbody id="taskBody"></tbody>
    </table>
  </div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
